name: build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        shell: powershell
        run: .\build.ps1

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: CrossMouse-win
          path: dist\Release\CrossMouse-win.zip

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: powershell
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view ${{ github.ref_name }} 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload ${{ github.ref_name }} dist\Release\CrossMouse-win.zip --clobber
          } else {
            gh release create ${{ github.ref_name }} dist\Release\CrossMouse-win.zip --title "CrossMouse ${{ github.ref_name }}" --generate-notes
          }
